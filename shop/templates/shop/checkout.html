{% extends 'shop/base.html' %}{% block title %}Checkout — ShopEase{% endblock %}{% block content %}<div class="page-head"><div><p class="eyebrow">CHECKOUT</p><h1>Delivery details</h1></div></div><div class="checkout"><form method="post" class="form-card">{% csrf_token %}<label>Full Name<input name="full_name" required value="{{ user.get_full_name }}"></label><label>Email<input type="email" name="email" required value="{{ user.email }}"></label><label>Phone<input name="phone" required></label><label>Address<textarea name="address" required rows="4"></textarea></label><div class="two"><label>City<input name="city" required></label><label>Pincode<input name="pincode" required pattern="[0-9]{6}"></label></div><button class="btn full">Place Order · ₹{{ total }}</button></form><aside class="summary"><h2>Payment</h2><p>This internship demo uses a mock checkout. No real payment is processed.</p><div class="row"><span>Order total</span><strong>₹{{ total }}</strong></div></aside></div>{% endblock %}
